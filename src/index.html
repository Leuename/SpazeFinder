<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpaceScanner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle dark or light theme">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.5V1.5a6.5 6.5 0 0 1 0 13z"/></svg>
  </button>

  <section id="drives" hidden>
    <h1>Select a drive</h1>
    <div class="drive-list"></div>
  </section>

  <section id="progress" hidden>
    <span id="scan-target">Scanning</span>
    <span id="prog-bytes">0 B</span>
    <span id="prog-files">0 files</span>
    <div class="sweep" role="progressbar" aria-label="Scan in progress"></div>
  </section>

  <section id="main" hidden>
    <header>
      <strong id="root-label"></strong>
      <span id="scan-summary"></span>
      <button id="switch-drive">Change drive</button>
      <button id="rescan">Rescan</button>
    </header>
    <div id="tree"></div>
  </section>

  <div id="menu" class="menu" hidden>
    <div data-act="open">Open</div>
    <div data-act="reveal">Reveal in Explorer</div>
    <div data-act="rename">Rename</div>
    <div data-act="move">Move to…</div>
    <div data-act="delete" class="danger">Delete (Recycle Bin)</div>
  </div>

  <script src="main.js"></script>
</body>
</html>
