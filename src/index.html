<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>SpazeFinder</title>
  <link rel="stylesheet" href="style.css">
  <script>
    // runs before first paint — otherwise the splash flashes light before main.js loads
    document.documentElement.dataset.theme =
      localStorage.getItem("theme") ||
      (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
  </script>
</head>
<body>
  <button id="theme-toggle" aria-label="Toggle dark or light theme">
    <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0a8 8 0 1 0 0 16A8 8 0 0 0 8 0zm0 14.5V1.5a6.5 6.5 0 0 1 0 13z"/></svg>
  </button>

  <!-- visible from first paint, before main.js runs; show() hides it -->
  <!-- shown when the UAC prompt was declined; see is_elevated -->
  <p id="no-admin" hidden role="status">
    No administrator access — protected system files and folders will be skipped.
  </p>

  <section id="splash">
    <img class="mark" src="icon.png" alt="" width="112" height="112">
    <h1>SpazeFinder</h1>
  </section>

  <section id="drives" hidden>
    <h1>Select a drive</h1>
    <div class="drive-list"></div>
  </section>

  <section id="progress" hidden>
    <img class="mark" src="icon.png" alt="" width="72" height="72">
    <span id="scan-target">Scanning</span>
    <span id="prog-bytes">0 B</span>
    <span id="prog-files">0 files</span>
    <div class="sweep" role="progressbar" aria-label="Scan in progress"></div>
  </section>

  <section id="main" hidden>
    <header>
      <strong id="root-label"></strong>
      <span id="scan-summary"></span>
      <button id="switch-drive">Change drive</button>
      <button id="rescan">Rescan</button>
    </header>
    <div id="tree"></div>
  </section>

  <div id="menu" class="menu" hidden>
    <div data-act="open">Open</div>
    <div data-act="reveal">Reveal in Explorer</div>
    <div data-act="rename">Rename</div>
    <div data-act="move">Move to…</div>
    <div data-act="delete" class="danger">Delete (Recycle Bin)</div>
  </div>

  <script>
    // The window starts hidden (tauri.conf.json "visible": false) because WebView2
    // takes ~1.2s to boot and a visible window is a blank rectangle for all of it.
    // Reveal only once the splash image is decoded AND a frame has been composited —
    // rAF alone fires before the PNG decodes, which showed an empty window for ~360ms.
    const splashImg = document.querySelector("#splash img");
    const painted = splashImg.decode ? splashImg.decode().catch(() => {}) : Promise.resolve();
    painted.then(() =>
      requestAnimationFrame(() =>
        requestAnimationFrame(() => window.__TAURI__.window.getCurrentWindow().show())
      )
    );
  </script>
  <script src="main.js"></script>
</body>
</html>
