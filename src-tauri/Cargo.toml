[package]
name = "spaze-finder"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Local-first disk usage scanner and filesystem cleanup tool for Windows"
repository = "https://github.com/Leuename/SpazeFinder"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rayon = "1"
trash = "5"
windows-sys = { version = "0.59", features = [
  "Win32_Storage_FileSystem",
  "Win32_Foundation",
  "Win32_System_Threading",
  "Win32_Security", # CreateMutexW takes SECURITY_ATTRIBUTES, so it is gated on this too
  "Win32_UI_Shell", # ShellExecuteW, to request elevation ourselves
  "Win32_UI_WindowsAndMessaging", # SHOW_WINDOW_CMD for the above
] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
